name: Feature Request
description: Suggest an idea, enhancement, or new feature for Déchaîner
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or enhancement for Déchaîner! Please provide details about your use case and idea below.
  - type: textarea
    id: problem_description
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific limitation? Please describe.
      placeholder: A clear and concise description of the motivation or problem (e.g., "I want to be able to ... because ...")
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature Description
      description: Describe what you would like to happen and how you envision this feature working.
      placeholder: Detailed description of the proposed feature or behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered or evaluated.
      placeholder: A description of any other solutions or approaches you've thought about.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, UI sketches, mockups, or screenshots about the feature request here.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and discussions to ensure this feature hasn't been requested already.
          required: true
