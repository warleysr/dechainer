name: "Gemini Code Review"

on:
  workflow_run:
    workflows: ["Extract PR Diff"]
    types:
      - completed

jobs:
  review:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Download PR Context
        uses: actions/download-artifact@v4
        with:
          name: pr-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR Number
        id: pr
        run: echo "PR_NUMBER=$(cat NR)" >> $GITHUB_OUTPUT

      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Run Gemini Review Action
        uses: derailed-dash/gemini-review-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        with:
          gemini_model: 'gemini-3.6-flash'
          language: 'English (US)'
          pull_request_number: ${{ steps.pr.outputs.PR_NUMBER }}
